[project]
name = "setup_ovs"
version = "2.0.0"
description = "Apply an OVS configuration from a JSON file"
authors = [
    { name = "Florent Carli", email = "florent.carli@rte-france.com" },
    { name = "Mathieu Dupré", email = "mathieu.dupre@savoirfairelinux.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "coverage[toml]",
]

[project.scripts]
setup_ovs = "setup_ovs.setup_ovs:main"

[project.urls]
Homepage = "https://github.com/seapath/python3-setup-ovs"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["setup_ovs"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
